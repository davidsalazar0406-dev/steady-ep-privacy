
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081510">

  <title>Publicación en Steady EP</title>
  <meta name="description" content="Descubre esta publicación en Steady EP.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Publicación en Steady EP">
  <meta property="og:description" content="Descubre esta publicación en Steady EP.">

  <style>
    body {
      margin: 0;
      background: #081510;
      color: #fff;
      font: 16px system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .card {
      max-width: 480px;
      margin: 24px;
      padding: 36px 24px;
      background: #10231b;
      border-radius: 24px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
    }

    p {
      color: #d1ded5;
      line-height: 1.6;
    }

    a {
      display: block;
      padding: 16px;
      margin-top: 16px;
      border-radius: 12px;
      background: #28df83;
      color: #06140d;
      font-weight: 700;
      text-decoration: none;
    }

    small {
      display: block;
      margin-top: 22px;
      color: #aabeb0;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Steady <span style="color:#28df83">EP</span></h1>

    <p>
      Esta publicación está en Steady EP.
      Ábrela en la aplicación para verla e interactuar con su creador.
    </p>

    <a id="open" href="#">Abrir en Steady EP</a>

    <p id="notice" aria-live="polite"></p>

    <small>
      Si todavía no tienes la aplicación,
      podrás instalarla cuando esté disponible en tu tienda.
    </small>
  </main>

  <script>
    const id = new URLSearchParams(window.location.search).get('id');

    const valid = typeof id === 'string' &&
      /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id);

    const button = document.getElementById('open');
    const notice = document.getElementById('notice');

    if (valid) {
      const appUrl = 'steadyep:///post/' + encodeURIComponent(id);

      button.href = appUrl;

      button.addEventListener('click', () => {
        notice.textContent =
          'Si Steady EP no se abre, verifica que tengas instalada la versión más reciente de la aplicación.';
      });
    } else {
      button.removeAttribute('href');
      button.style.opacity = '0.5';
      button.style.pointerEvents = 'none';

      notice.textContent = 'El enlace de la publicación no es válido.';
    }
  </script>
</body>
</html>
